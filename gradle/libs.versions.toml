# Versions marked "verified" were confirmed against release notes on 2026-11-23.
# Versions marked "check" could not be confirmed from this sandbox (Maven Central and
# Google Maven were unreachable). Bump them to the latest stable on first sync.
[versions]
kotlin = "2.4.20"                 # verified: kotlinlang.org/docs/whatsnew2420.html (Sep 7 2026)
compose-multiplatform = "1.12.0"  # check: 1.13.0 was still RC on 2026-11-18
agp = "9.1.0"                     # verified: AGP 9.1.0 required by compose.ui:1.12.0 and compileSdk 37
ktor = "3.6.1"                    # verified: ktor.io docs header
coroutines = "1.10.2"             # check
serialization = "1.9.0"           # check
coil = "3.3.0"                    # check
lifecycle-multiplatform = "2.11.0"
navigation-multiplatform = "2.9.1" # check (CMP 1.13 ships 2.10.0)
androidx-activity = "1.11.0"      # check
camerax = "1.5.0"                 # check
zxing = "3.5.3"                   # check
credentials = "1.5.0"             # check
googleid = "1.1.1"                # check
flyway = "11.10.0"                # check
postgres = "42.7.7"               # check
hikari = "6.3.0"                  # check
logback = "1.5.18"                # check
google-api-client = "2.8.0"       # check
java-keyring = "1.0.4"            # check

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
